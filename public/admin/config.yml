# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.173.0/schema/sveltia-cms.json
#
# Unica fonte di verità della configurazione CMS.
# I campi qui devono restare allineati allo schema Zod di src/content.config.ts:
# un campo che manca qui ma è obbligatorio là fa fallire il build al primo salvataggio.

backend:
  name: github
  repo: advlabbik/cycling-in-tuscany
  branch: main
  # Worker `sveltia-cms-auth` già in uso per bikepacking.it — riusato, non duplicato.
  # Il client secret vive lì dentro e non passa mai da questa repo.
  # Documentazione del setup: advlabbik/bikepacking-static, docs/deploy/cms-setup.md
  base_url: https://bikepacking-cms-auth.account-fe1.workers.dev
  # Nessun `auth_endpoint`: il worker espone solo /auth e /callback, quindi il default
  # di Sveltia è già quello giusto. Il valore precedente (`/auth/github`) dava 404.

# Fallback globale, di fatto mai usato: ogni campo immagine o file ha un override
# di collezione o di campo. Se un giorno se ne aggiunge uno senza override, l'upload
# finisce qui — cioè in public/, fuori dalla pipeline di ottimizzazione di astro:assets.
media_folder: public/images
public_folder: /images

collections:
  - name: territori
    label: Territori
    folder: src/content/territori
    create: true
    slug: "{{name}}"
    # Percorso relativo alla cartella della collezione: gli upload finiscono in
    # src/assets/images/ e nel frontmatter viene scritto `../../assets/images/x.jpg`,
    # l'unica forma che image() di astro:assets sa risolvere (#25).
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: name, label: Name, widget: string }
      - { name: tier, label: Tier, widget: select, options: [premium, standard] }
      - { name: area, label: Area, widget: string }
      - { name: tagline, label: Tagline, widget: string }
      - { name: intro, label: Intro, widget: text }
      - { name: itinerariTxt, label: "What to see — intro", widget: text }
      - name: coords
        label: Coordinates
        widget: object
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float }
          - { name: lng, label: Longitude, widget: number, value_type: float }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: cosaVedere
        label: What to see
        widget: list
        fields:
          - { name: titolo, label: Title, widget: string }
          - { name: descrizione, label: Description, widget: text }
          - { name: image, label: Image, widget: image, required: false }
      - name: ridePack
        label: Ride pack
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string }
          - { name: type, label: Type, widget: select, options: [Gravel, Road] }
          - { name: km, label: KM, widget: string }
          - { name: dislivello, label: Dislivello, widget: string }
          - { name: diff, label: Difficulty, widget: string }
          - { name: surface, label: Surface, widget: string }
          - { name: hi, label: Highlight, widget: string }
          - name: url
            label: Ride with GPS URL
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
          - name: page
            label: "Pagina itinerario interna"
            widget: string
            required: false
            hint: "Es. /itinerari/mr-gravel-1 — se presente, la card porta lì invece che su Ride with GPS."
      - name: trailforksMap
        label: "Mappa Trailforks (bike area vicina)"
        widget: object
        required: false
        hint: >-
          La mappa dei sentieri di una bike area, presa da Trailforks e sempre
          aggiornata da chi li cura. Vuota = niente mappa. L'id regione sta nello
          slug dell'URL Trailforks, es. monte-calvi-trail-area-33427 -> 33427.
        fields:
          - { name: rid, label: "ID regione Trailforks", widget: number, value_type: int }
          - name: href
            label: "URL della pagina Trailforks"
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
          - { name: badge, label: Badge (opzionale), widget: string, required: false }
          - { name: title, label: Titolo sezione, widget: string }
          - { name: text, label: Testo sezione, widget: text }
          - { name: note, label: "Nota sotto la mappa (opzionale)", widget: text, required: false }
      - name: stay22Map
        label: "Mappa prenotazioni Stay22 (testa pagina)"
        widget: object
        required: false
        hint: "La mappa embeddata subito dopo l'hero. Vuota = niente mappa."
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float }
          - { name: lng, label: Longitude, widget: number, value_type: float }
          - { name: venue, label: Venue (etichetta sulla mappa), widget: string }
          - { name: campaign, label: "Campagna Stay22 (es. cit-campiglia)", widget: string }
          - { name: badge, label: Badge (opzionale), widget: string, required: false }
          - { name: title, label: Titolo sezione, widget: string }
          - { name: text, label: Testo sezione, widget: text }
      - name: magazine
        label: Magazine
        widget: object
        required: false
        hint: >-
          Sezione magazine della pagina territorio. Lasciala vuota se il territorio
          non ha un articolo. Il corpo dell'articolo si scrive nel body della pagina,
          sotto il form: se il body è vuoto compaiono solo titolo, box e fonte.
        fields:
          - { name: heroTitle, label: Hero title, widget: string }
          - name: boxes
            label: Boxes
            widget: list
            fields:
              - { name: titolo, label: Title, widget: string }
              - { name: testo, label: Text, widget: text }
          - { name: fonte, label: Source, widget: string, required: false }
      - name: channels
        label: Channels
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - name: url
            label: URL
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - name: numeriUtili
        label: Useful numbers
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - name: value
            label: Value
            widget: string
            hint: "Sempre col prefisso internazionale, per esempio +39 0565 838470 — chi legge il sito è straniero e da telefono chiama con un tocco"
      # I PDF restano in public/: sono serviti così come sono, non passano da astro:assets.
      # Dal 15/8 il campo è facoltativo: le guide non si scaricano più, i contenuti
      # vivono nelle sezioni extra della pagina.
      - name: guidaPdf
        label: Guide PDF
        widget: file
        required: false
        media_folder: /public/guide-pdf
        public_folder: /guide-pdf
      - name: extraSections
        label: "Sezioni extra (contenuti della guida)"
        widget: list
        required: false
        hint: "I contenuti della guida territorio, in chiaro nella pagina."
        fields:
          - { name: title, label: Titolo sezione, widget: string }
          - { name: sub, label: Sottotitolo, widget: string, required: false }
          - name: cards
            label: Card
            widget: list
            fields:
              - { name: label, label: Titolo card, widget: string }
              - { name: text, label: Testo card, widget: text }
      - { name: body, label: Magazine body, widget: markdown }

  - name: faq
    label: FAQ
    folder: src/content/faq
    create: true
    # Lo slug viene dalla domanda, quindi il nome file non dice più niente sull'ordine:
    # è il campo `order` a decidere la sequenza in home (#34).
    slug: "{{question}}"
    sortable_fields: [order, question]
    # Nessun campo `body`: le FAQ sono solo frontmatter, domanda e risposta.
    fields:
      - name: order
        label: Order
        widget: number
        value_type: int
        hint: Posizione in home. I numeri più bassi vengono prima; i buchi non danno problemi.
      - { name: question, label: Question, widget: string }
      - { name: answer, label: Answer, widget: text }

  - name: strutture
    label: Strutture
    folder: src/content/strutture
    create: true
    slug: "{{name}}"
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: name, label: Name, widget: string }
      - { name: town, label: Town, widget: string }
      - { name: tagline, label: Tagline, widget: string }
      - { name: intro, label: Intro, widget: text }
      - name: site
        label: Booking site
        widget: string
        pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - name: coords
        label: Coordinates
        widget: object
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float }
          - { name: lng, label: Longitude, widget: number, value_type: float }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: card
        label: Card
        widget: object
        fields:
          - { name: categoria, label: Category, widget: string }
          - { name: promise, label: Promise, widget: string }
          - { name: bullets, label: Bullets, widget: list }
          - { name: caption, label: Caption, widget: string }
          - { name: tint, label: Tint, widget: string }
      - { name: services, label: Services, widget: list }
      - name: ridePack
        label: Ride pack
        widget: list
        fields:
          - { name: name, label: Name, widget: string }
          - { name: type, label: Type, widget: select, options: [Gravel, Road] }
          - { name: km, label: KM, widget: string }
          - { name: dislivello, label: Dislivello, widget: string }
          - { name: diff, label: Difficulty, widget: string }
          - { name: surface, label: Surface, widget: string }
          - { name: hi, label: Highlight, widget: string }
          - name: url
            label: Ride with GPS URL
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
          - name: page
            label: "Pagina itinerario interna"
            widget: string
            required: false
            hint: "Es. /itinerari/vt-gravel-1 — se presente, la card porta lì invece che su Ride with GPS."
      - name: guidaPdf
        label: Guide PDF
        widget: file
        required: false
        media_folder: /public/guide-pdf
        public_folder: /guide-pdf
      - name: extraSections
        label: "Sezioni extra (contenuti del Ride Base Pack)"
        widget: list
        required: false
        hint: "I contenuti del pack che vivono nella scheda: aree di riding, itinerari-tipo, tips."
        fields:
          - { name: title, label: Titolo sezione, widget: string }
          - { name: sub, label: Sottotitolo, widget: string, required: false }
          - name: cards
            label: Card
            widget: list
            fields:
              - { name: label, label: Titolo card, widget: string }
              - { name: text, label: Testo card, widget: text }

  - name: itinerari
    label: Itinerari
    folder: src/content/itinerari
    create: true
    slug: "{{slug}}"
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: name, label: Name, widget: string }
      - { name: type, label: Type, widget: select, options: [Gravel, Road] }
      - { name: area, label: Area, widget: string }
      - { name: tagline, label: Tagline, widget: string }
      - { name: intro, label: Intro, widget: text }
      - { name: km, label: "KM (ufficiali, dal pack)", widget: string }
      - { name: dislivello, label: Dislivello, widget: string }
      - { name: diff, label: Difficulty, widget: string }
      - { name: surface, label: Surface, widget: string }
      - { name: time, label: Time, widget: string }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: base
        label: "Struttura partner (esclusiva alloggio)"
        widget: object
        required: false
        hint: "Se impostata, sull'itinerario si dorme SOLO da lei — niente altri alloggi in pagina."
        fields:
          - { name: slug, label: "Slug struttura (es. villa-toscana)", widget: string }
          - { name: name, label: Nome, widget: string }
          - name: site
            label: Sito prenotazioni
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - name: territory
        label: "Territorio (per route senza partner)"
        widget: object
        required: false
        fields:
          - { name: slug, label: "Slug territorio (es. monterotondo-marittimo)", widget: string }
          - { name: name, label: Nome, widget: string }
      - { name: highlights, label: Highlights, widget: list }
      - name: rwgpsUrl
        label: Ride with GPS URL
        widget: string
        required: false
        pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - { name: gpx, label: "GPX (path in public/, es. /gpx/X.gpx)", widget: string }
      - name: goodToKnow
        label: "Good to know (contenuti del pack)"
        widget: list
        required: false
        fields:
          - { name: label, label: Titolo, widget: string }
          - { name: text, label: Testo, widget: text }
      - name: trackData
        label: "Dati traccia (path JSON generato)"
        widget: string
        hint: "Generato da scripts/gen_poi.py — NON scrivere a mano (es. /data/itinerari/x.json)."
      - { name: stay22Campaign, label: "Campagna Stay22 (es. cit-vt-gravel-1)", widget: string }
      - name: stay22Center
        label: "Centro mappa Stay22"
        widget: object
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float }
          - { name: lng, label: Longitude, widget: number, value_type: float }
      - { name: body, label: Body, widget: markdown, required: false }
