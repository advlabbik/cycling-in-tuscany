# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.173.0/schema/sveltia-cms.json
#
# Unica fonte di verità della configurazione CMS.
# I campi qui devono restare allineati allo schema Zod di src/content.config.ts:
# un campo che manca qui ma è obbligatorio là fa fallire il build al primo salvataggio.

backend:
  name: github
  repo: advlabbik/cycling-in-tuscany
  branch: main
  # Worker `sveltia-cms-auth` già in uso per bikepacking.it — riusato, non duplicato.
  # Il client secret vive lì dentro e non passa mai da questa repo.
  # Documentazione del setup: advlabbik/bikepacking-static, docs/deploy/cms-setup.md
  base_url: https://bikepacking-cms-auth.account-fe1.workers.dev
  # Nessun `auth_endpoint`: il worker espone solo /auth e /callback, quindi il default
  # di Sveltia è già quello giusto. Il valore precedente (`/auth/github`) dava 404.

# Fallback globale, di fatto mai usato: ogni campo immagine o file ha un override
# di collezione o di campo. Se un giorno se ne aggiunge uno senza override, l'upload
# finisce qui — cioè in public/, fuori dalla pipeline di ottimizzazione di astro:assets.
media_folder: public/images
public_folder: /images

collections:
  - name: territori
    label: Territori
    folder: src/content/territori
    create: true
    slug: "{{name}}"
    # Percorso relativo alla cartella della collezione: gli upload finiscono in
    # src/assets/images/ e nel frontmatter viene scritto `../../assets/images/x.jpg`,
    # l'unica forma che image() di astro:assets sa risolvere (#25).
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: name, label: Name, widget: string }
      - { name: tier, label: Tier, widget: select, options: [premium, standard] }
      - { name: area, label: Area, widget: string }
      - { name: tagline, label: Tagline, widget: string }
      - { name: intro, label: Intro, widget: text }
      - { name: itinerariTxt, label: "What to see — intro", widget: text }
      - name: coords
        label: Coordinates
        widget: object
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float }
          - { name: lng, label: Longitude, widget: number, value_type: float }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: cosaVedere
        label: What to see
        widget: list
        fields:
          - { name: titolo, label: Title, widget: string }
          - { name: descrizione, label: Description, widget: text }
          - { name: image, label: Image, widget: image, required: false }
      - name: ridePack
        label: Ride pack
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string }
          - { name: type, label: Type, widget: select, options: [Gravel, Road] }
          - { name: km, label: KM, widget: string }
          - { name: dislivello, label: Dislivello, widget: string }
          - { name: diff, label: Difficulty, widget: string }
          - { name: surface, label: Surface, widget: string }
          - { name: hi, label: Highlight, widget: string }
          - name: url
            label: Ride with GPS URL
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - name: magazine
        label: Magazine
        widget: object
        required: false
        hint: >-
          Sezione magazine della pagina territorio. Lasciala vuota se il territorio
          non ha un articolo. Il corpo dell'articolo si scrive nel body della pagina,
          sotto il form: se il body è vuoto compaiono solo titolo, box e fonte.
        fields:
          - { name: heroTitle, label: Hero title, widget: string }
          - name: boxes
            label: Boxes
            widget: list
            fields:
              - { name: titolo, label: Title, widget: string }
              - { name: testo, label: Text, widget: text }
          - { name: fonte, label: Source, widget: string, required: false }
      - name: channels
        label: Channels
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - name: url
            label: URL
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - name: numeriUtili
        label: Useful numbers
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      # I PDF restano in public/: sono serviti così come sono, non passano da astro:assets.
      - name: guidaPdf
        label: Guide PDF
        widget: file
        media_folder: /public/guide-pdf
        public_folder: /guide-pdf
      - { name: body, label: Magazine body, widget: markdown }

  - name: strutture
    label: Strutture
    folder: src/content/strutture
    create: true
    slug: "{{name}}"
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    fields:
      - { name: name, label: Name, widget: string }
      - { name: town, label: Town, widget: string }
      - { name: tagline, label: Tagline, widget: string }
      - { name: intro, label: Intro, widget: text }
      - name: site
        label: Booking site
        widget: string
        pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - name: coords
        label: Coordinates
        widget: object
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float }
          - { name: lng, label: Longitude, widget: number, value_type: float }
      - { name: heroImage, label: Hero image, widget: image, required: false }
      - name: card
        label: Card
        widget: object
        fields:
          - { name: categoria, label: Category, widget: string }
          - { name: promise, label: Promise, widget: string }
          - { name: bullets, label: Bullets, widget: list }
          - { name: caption, label: Caption, widget: string }
          - { name: tint, label: Tint, widget: string }
      - { name: services, label: Services, widget: list }
      - name: ridePack
        label: Ride pack
        widget: list
        fields:
          - { name: name, label: Name, widget: string }
          - { name: type, label: Type, widget: select, options: [Gravel, Road] }
          - { name: km, label: KM, widget: string }
          - { name: dislivello, label: Dislivello, widget: string }
          - { name: diff, label: Difficulty, widget: string }
          - { name: surface, label: Surface, widget: string }
          - { name: hi, label: Highlight, widget: string }
          - name: url
            label: Ride with GPS URL
            widget: string
            pattern: ['^https?://', "Serve un URL completo, con https:// davanti"]
      - name: guidaPdf
        label: Guide PDF
        widget: file
        media_folder: /public/guide-pdf
        public_folder: /guide-pdf
